[project]
name = "thirty-days-geoai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Silas Mwandikwa", email = "mwandikwasilas68@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "anomalib>=2.7.0",
    "anomalytics>=0.2.2",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "netcdf4>=1.7.5.1.post1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "regionmask>=0.13.0",
    "requests>=2.34.2",
    "rioxarray>=0.23.0",
    "xarray>=2026.9.0",
]

[project.scripts]
thirty-days-geoai = "thirty_days_geoai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
exclude = [
    "renv",
    ".venv",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
# E/F: errors and pyflakes, I: import order, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
