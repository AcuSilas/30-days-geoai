name: lint

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync              # rebuild the env from uv.lock
      - run: uv run pre-commit run --all-files
        env:
          SKIP: style-files,lintr  # R checks run in their own job

  r:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"  # don't bootstrap renv in CI
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Lint R files
        shell: Rscript {0}
        run: |
          install.packages("lintr")
          lints <- lintr::lint_dir(".")
          print(lints)
          quit(status = as.integer(length(lints) > 0))